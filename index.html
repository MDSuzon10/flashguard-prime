<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Guard Pro - Secure AI</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #0a0f1e; color: #00f3ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .panel { border: 2px solid #1a2639; padding: 20px; border-radius: 15px; background: #111827; box-shadow: 0 0 20px rgba(0,243,255,0.1); max-width: 400px; margin: auto; }
        .chat-box { background: #0a0f1e; border: 1px solid #1a2639; height: 200px; overflow-y: auto; padding: 10px; margin-top: 20px; text-align: left; border-radius: 10px; font-size: 14px; }
        input { width: 65%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #00f3ff; background: #111827; color: white; outline: none; }
        .send-btn { padding: 12px 15px; background: #00f3ff; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; color: black; }
        .status-light { width: 20px; height: 20px; border-radius: 50%; display: inline-block; margin-top: 10px; border: 2px solid #334155; }
        .on { background: #ff003c; box-shadow: 0 0 15px #ff003c; border-color: #ff003c; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>FLASH GUARD PRO</h2>
        <p style="color: #64748b; font-size: 12px;">সিকিউর এআই কমান্ড সেন্টার</p>
        <div id="light-status" class="status-light"></div>
        <p id="light-text" style="font-size: 14px;">পুলিশ লাইট: বন্ধ</p>
        <div class="chat-box" id="chat">
            <div><span style="color: #00ff9f;">AI:</span> স্বাগতম! আমি এখন প্রস্তুত।</div>
        </div>
        <input type="text" id="user-input" placeholder="এখানে লিখুন...">
        <button class="send-btn" onclick="askAI()">Send</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAeASlfFcjrtmp6vL8nc_BVvD_IedXXpP8",
            authDomain: "flashguardpro.firebaseapp.com",
            databaseURL: "https://flashguardpro-default-rtdb.firebaseio.com",
            projectId: "flashguardpro",
            storageBucket: "flashguardpro.firebasestorage.app",
            messagingSenderId: "960010161507",
            appId: "1:960010161507:web:3634d947ea7b260031d756"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        async function askAI() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat');
            const cmd = input.value;
            if(!cmd) return;

            chat.innerHTML += `<div><span style="color: #00f3ff;">You:</span> ${cmd}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            const prompt = `You are a smart security assistant. If user wants to turn on light, reply ONLY: {"action":"on"}. If off, reply ONLY: {"action":"off"}. Otherwise reply in Bengali. User command: ${cmd}`;
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ prompt: prompt })
                });
                
                const data = await response.json();

                // যদি গুগল থেকে কোনো এরর আসে
                if (data.error) {
                    chat.innerHTML += `<div style="color: #ff003c;"><b>AI Error:</b> ${data.error.message}</div>`;
                    return;
                }

                if (data.candidates && data.candidates[0]) {
                    const aiRes = data.candidates[0].content.parts[0].text;
                    
                    if(aiRes.includes('"action":"on"')) {
                        db.ref('system/police_light').set(1);
                        chat.innerHTML += `<div><span style="color: #00ff9f;">AI:</span> জি স্যার, লাইট জ্বালিয়ে দিয়েছি।</div>`;
                    } else if(aiRes.includes('"action":"off"')) {
                        db.ref('system/police_light').set(0);
                        chat.innerHTML += `<div><span style="color: #00ff9f;">AI:</span> ঠিক আছে, লাইট বন্ধ করা হয়েছে।</div>`;
                    } else {
                        chat.innerHTML += `<div><span style="color: #00ff9f;">AI:</span> ${aiRes}</div>`;
                    }
                } else {
                    chat.innerHTML += `<div style="color: #ff003c;"><b>Error:</b> এআই কোনো উত্তর দেয়নি।</div>`;
                }
            } catch (e) {
                chat.innerHTML += `<div style="color: #ff003c;"><b>System Error:</b> সংযোগ বিচ্ছিন্ন হয়েছে।</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        db.ref('system/police_light').on('value', (snapshot) => {
            const val = snapshot.val();
            const light = document.getElementById('light-status');
            const text = document.getElementById('light-text');
            if(val == 1) { light.classList.add('on'); text.innerText = "পুলিশ লাইট: জ্বলছে"; }
            else { light.classList.remove('on'); text.innerText = "পুলিশ লাইট: বন্ধ"; }
        });
    </script>
</body>
</html>
