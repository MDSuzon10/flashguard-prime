<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Guard Pro - AI Control</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { background-color: #0a0f1e; color: #00f3ff; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .panel { border: 2px solid #1a2639; padding: 20px; border-radius: 15px; background: #111827; box-shadow: 0 0 20px rgba(0,243,255,0.1); max-width: 400px; margin: auto; }
        .chat-box { background: #0a0f1e; border: 1px solid #1a2639; height: 200px; overflow-y: auto; padding: 10px; margin-top: 20px; text-align: left; border-radius: 10px; font-size: 14px; line-height: 1.5; }
        input { width: 70%; padding: 12px; margin-top: 10px; border-radius: 5px; border: 1px solid #00f3ff; background: #111827; color: white; outline: none; }
        .send-btn { padding: 12px 20px; background: #00f3ff; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; color: black; }
        .status-light { width: 20px; height: 20px; border-radius: 50%; display: inline-block; margin-top: 10px; border: 2px solid #334155; transition: 0.3s; }
        .on { background: #ff003c; box-shadow: 0 0 15px #ff003c; border-color: #ff003c; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>FLASH GUARD PRO</h2>
        <p style="color: #64748b; font-size: 12px;">এআই কমান্ড সেন্টার (v1.2)</p>
        
        <div id="light-status" class="status-light"></div>
        <p id="light-text" style="font-size: 14px;">পুলিশ লাইট: বন্ধ</p>

        <div class="chat-box" id="chat">
            <div><span style="color: #00ff9f;">AI:</span> স্বাগতম! আমি আপনাকে কীভাবে সাহায্য করতে পারি?</div>
        </div>
        <input type="text" id="user-input" placeholder="এখানে লিখুন...">
        <button class="send-btn" onclick="askAI()">Send</button>
    </div>

    <script>
        // ১. আপনার Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAeASlfFcjrtmp6vL8nc_BVvD_IedXXpP8",
            authDomain: "flashguardpro.firebaseapp.com",
            databaseURL: "https://flashguardpro-default-rtdb.firebaseio.com",
            projectId: "flashguardpro",
            storageBucket: "flashguardpro.firebasestorage.app",
            messagingSenderId: "960010161507",
            appId: "1:960010161507:web:3634d947ea7b260031d756"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // ২. আপনার Gemini API Key
        const GEMINI_API_KEY = "AIzaSyDayaaP2D3ho6L9W6JSmE7Nf604wnCWU8I";

        async function askAI() {
            const input = document.getElementById('user-input');
            const chat = document.getElementById('chat');
            const cmd = input.value;
            if(!cmd) return;

            chat.innerHTML += `<div><span style="color: #00f3ff;">You:</span> ${cmd}</div>`;
            input.value = "";
            chat.scrollTop = chat.scrollHeight;

            const prompt = `You are a smart security assistant. 
            If user wants to turn on light, reply ONLY: {"action":"on"}. 
            If off, reply ONLY: {"action":"off"}. 
            Otherwise reply in Bengali. User command: ${cmd}`;
            
            try {
                // এখানে মডেলের নাম 'gemini-pro' ব্যবহার করা হয়েছে যা সবচেয়ে স্টেবল
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        "contents": [{"parts": [{"text": prompt}]}]
                    })
                });
                
                const data = await response.json();

                if (data.error) {
                    // যদি gemini-pro ও কাজ না করে, তবে gemini-1.5-flash-latest ট্রাই করবে
                    console.log("Retrying with fallback model...");
                    return retryWithFlash(cmd);
                }

                const aiRes = data.candidates[0].content.parts[0].text;
                processAIResponse(aiRes);

            } catch (e) {
                chat.innerHTML += `<div style="color: #ff003c;"><b>Error:</b> সংযোগে সমস্যা হচ্ছে।</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        // ফলব্যাক ফাংশন (যদি প্রথম মডেল ফেল করে)
        async function retryWithFlash(cmd) {
            const chat = document.getElementById('chat');
            const prompt = `You are a smart security assistant. If user wants to turn on light, reply ONLY: {"action":"on"}. If off, reply ONLY: {"action":"off"}. Otherwise reply in Bengali. User command: ${cmd}`;
            
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({"contents": [{"parts": [{"text": prompt}]}]})
                });
                const data = await response.json();
                if(data.error) {
                    chat.innerHTML += `<div style="color: #ff003c;"><b>Error:</b> ${data.error.message}</div>`;
                } else {
                    const aiRes = data.candidates[0].content.parts[0].text;
                    processAIResponse(aiRes);
                }
            } catch (e) {
                chat.innerHTML += `<div style="color: #ff003c;"><b>Error:</b> এআই সংযোগে সমস্যা হচ্ছে।</div>`;
            }
        }

        function processAIResponse(aiRes) {
            const chat = document.getElementById('chat');
            if(aiRes.includes('"action":"on"')) {
                db.ref('system/police_light').set(1);
                chat.innerHTML += `<div><span style="color: #00ff9f;">AI:</span> জি স্যার, লাইট জ্বালিয়ে দিয়েছি।</div>`;
            } else if(aiRes.includes('"action":"off"')) {
                db.ref('system/police_light').set(0);
                chat.innerHTML += `<div><span style="color: #00ff9f;">AI:</span> ঠিক আছে, লাইট বন্ধ করা হয়েছে।</div>`;
            } else {
                chat.innerHTML += `<div><span style="color: #00ff9f;">AI:</span> ${aiRes}</div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }

        // ডাটাবেস থেকে লাইভ আপডেট
        db.ref('system/police_light').on('value', (snapshot) => {
            const val = snapshot.val();
            const light = document.getElementById('light-status');
            const text = document.getElementById('light-text');
            if(val == 1) {
                light.classList.add('on');
                text.innerText = "পুলিশ লাইট: জ্বলছে";
            } else {
                light.classList.remove('on');
                text.innerText = "পুলিশ লাইট: বন্ধ";
            }
        });
    </script>
</body>
</html>
